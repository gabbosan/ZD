<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cálculo Estorno x Cupom</title>

<style>

*{
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#f4f4f4;
    padding:8% 20%;
    justify-content:center;
}

.container{
    background:#fff;
	width:100%;
	align-items:center;
    border-radius:8px;
    box-shadow:0 2px 10px rgba(0,0,0,.1);
}

table{
	width:100%;
    border-collapse:collapse;
    
	
}

th{
    background:#003B75;
    color:#fff;
    border:2px solid #d9d9d9;
    padding:12px 10px;
    font-size:20px;
    white-space:nowrap;
}

td{
    background:#E7EEF0;
    border:2px solid #d9d9d9;
    padding:12px 10px;
    font-size:20px;
    text-align:center;
    white-space:nowrap;
}

.entrada{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:4px;
    white-space:nowrap;
}

.entrada span{
    font-weight:bold;
}

.entrada input{
    border:none;
    outline:none;
    background:transparent;
    text-align:center;
    font-size:20px;
    font-weight:bold;
  
}

.resultado{
    font-weight:bold;
    white-space:nowrap;
}

.banner{
	width:100%;
    border-radius:8px;
    box-shadow:0 2px 10px rgba(0,0,0,.1);
    margin-top:25px;
    background:#A8C1C6;
    text-align:center;
    padding:35px 20px;
}

.banner h1{
    margin:0;
    color:#003B75;
    font-size:clamp(38px,6vw,72px);
}

.banner h2{
    margin:0;
    color:#003B75;
    font-size:clamp(18px,3vw,32px);
}

@media(max-width:900px){

    body{
        padding:10px;
    }

    .container{
        overflow-x:auto;
        width:100%;
    }

    table{
        width:100%;
    }

}

</style>
</head>
<body>

<div class="container">

<table>

<tr>
    <th>Ticket</th>
    <th>Cupom</th>
    <th>Prejuízo</th>
    <th>Investimento</th>
    <th>Estorno</th>
    <th>CupomCX</th>
</tr>

<tr>

<td>
    <div class="entrada">
        <span>R$</span>
        <input id="ticket"
               value="0,00"
               oninput="formatarMoeda(this);calcular();">
    </div>
</td>

<td>
    <div class="entrada">
        <span>R$</span>
        <input id="cupom"
               value="0,00"
               oninput="formatarMoeda(this);calcular();">
    </div>
</td>

<td>
    <div class="entrada">
        <span>R$</span>
        <input id="prejuizo"
               value="0,00"
               oninput="formatarMoeda(this);calcular();">
    </div>
</td>

<td class="resultado" id="investimento">
    R$ 0,00
</td>

<td class="resultado" id="estorno">
    R$ 0,00
</td>

<td class="resultado" id="cupomcx">
    —
</td>

</tr>

</table>

<div class="banner">
    <h1>CÁLCULO</h1>
    <h2>ESTORNO x CUPOM</h2>
</div>

</div>

<script>

function ajustarLargura(input){
    input.style.width =
        Math.max(input.value.length, 4) + 'ch';
}

function formatarMoeda(input){

    let valor = input.value.replace(/\D/g,'');

    if(valor === ''){
        valor = '0';
    }

    valor = (parseInt(valor,10)/100).toLocaleString(
        'pt-BR',
        {
            minimumFractionDigits:2,
            maximumFractionDigits:2
        }
    );

    input.value = valor;

    ajustarLargura(input);
}

function moedaParaNumero(valor){

    return parseFloat(
        valor
            .replace(/\./g,'')
            .replace(',','.')
    ) || 0;

}

function moeda(valor){

    return valor.toLocaleString(
        'pt-BR',
        {
            minimumFractionDigits:2,
            maximumFractionDigits:2
        }
    );

}

function calcular(){

    let ticket =
        moedaParaNumero(
            document.getElementById('ticket').value
        );

    let cupom =
        moedaParaNumero(
            document.getElementById('cupom').value
        );

    let prejuizo =
        moedaParaNumero(
            document.getElementById('prejuizo').value
        );

    /* REGRA: PREJUÍZO NÃO PODE SER MAIOR QUE O TICKET */

    if(prejuizo > ticket){

        prejuizo = ticket;

        document.getElementById('prejuizo').value =
            moeda(ticket);

        ajustarLargura(
            document.getElementById('prejuizo')
        );

    }

    let investimento = ticket - cupom;

    let estorno;
    let cupomcx = null;

    if(prejuizo > investimento){

        estorno = investimento;

        let diferenca =
            prejuizo - investimento;

        cupomcx =
            Math.ceil(diferenca / 5) * 5;

    }else{

        estorno = prejuizo;

    }

    document.getElementById('investimento').textContent =
        'R$ ' + moeda(investimento);

    document.getElementById('estorno').textContent =
        'R$ ' + moeda(estorno);

    document.getElementById('cupomcx').textContent =
        cupomcx === null
        ? '—'
        : 'R$ ' + moeda(cupomcx);

}



window.onload = function(){

    ['ticket','cupom','prejuizo'].forEach(id => {

        const campo =
            document.getElementById(id);

        formatarMoeda(campo);

    });

    calcular();

};

</script>

</body>
</html>
